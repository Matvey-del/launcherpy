name: Build STIVOX Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "redesign/**"

concurrency:
  group: stovix-windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows Server 2022 runner produces a Windows desktop executable
    # compatible with supported Windows 10 and Windows 11 systems.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install minecraft-launcher-lib==6.5 pyinstaller==6.11.1 Pillow==11.0.0

      - name: Check Python syntax
        run: python -m py_compile launcher.py

      - name: Validate launcher navigation and helper methods
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          $args = @(
            "--onefile",
            "--noconsole",
            "--clean",
            "--name", "STIVOXLauncher",
            "--collect-all", "minecraft_launcher_lib"
          )
          if (Test-Path "assets") {
            $args += @("--add-data", "assets;assets")
          }
          python -m PyInstaller @args launcher.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/STIVOXLauncher.exe")) {
            throw "PyInstaller did not produce STIVOXLauncher.exe"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: STIVOXLauncher-Windows
          path: dist/STIVOXLauncher.exe
          if-no-files-found: error
