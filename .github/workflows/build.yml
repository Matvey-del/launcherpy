name: Build exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install minecraft-launcher-lib==6.5 pyinstaller==5.13.2

      - name: Check syntax
        run: python -m py_compile launcher.py

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name RedLauncher launcher.py

      - uses: actions/upload-artifact@v5
        with:
          name: RedLauncher
          path: dist/RedLauncher.exe
