name: Build exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: pip install minecraft-launcher-lib pyinstaller==5.13.2

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name RedLauncher launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: RedLauncher
          path: dist/RedLauncher.exe
